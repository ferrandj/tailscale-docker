# Tailscale: connecte le NAS à ton réseau Tailscale (tailnet). Aucun secret dans ce fichier.
#
# Une fois démarré, le NAS devient une machine de ton tailnet: depuis ton téléphone ou ton ordinateur (avec l'app
# Tailscale connectée à ton compte), tu atteins ses services par son adresse Tailscale (100.x.y.z) ou par son nom
# (ex.: http://nas:10458), sans ouvrir de port sur la box.
#
# Voir README.md pour la liste complète des étapes et des variables à mettre dans le fichier ".env".
services:
  tailscale:
    # :stable = toujours la dernière version stable de Tailscale (:v1.104.4 par exemple = figé sur une version).
    # Elle se met à jour quand tu fais le "pull" ci-dessous, pas toute seule.
    image: tailscale/tailscale:stable
    container_name: tailscale
    restart: unless-stopped
    # Réseau du NAS lui-même: c'est le NAS qui entre dans le tailnet (pas seulement ce conteneur).
    # (Avec ce mode, on ne met pas de "hostname:" ni de "ports:": le nom vient de TS_HOSTNAME.)
    network_mode: host
    environment:
      TZ: Europe/Paris
      # Obligatoire: la clé d'authentification, dans le fichier .env.
      TS_AUTHKEY: "${TS_AUTHKEY:?Mets TS_AUTHKEY dans le fichier .env (voir README.md)}"
      # true = n'utilise la clé qu'à la première connexion (une clé expirée ne bloque pas les redémarrages).
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: "${TS_HOSTNAME:-nas}"
      # Doit être conservé entre les redémarrages, sinon chaque redémarrage crée une nouvelle machine dans ton tailnet.
      TS_STATE_DIR: /var/lib/tailscale
      # Mode « noyau » (recommandé pour un NAS: le NAS est joignable sur toutes ses adresses et ports).
      # Si /dev/net/tun n'existe pas: mets "true" ici et mets en commentaire les blocs "devices:" et "cap_add:".
      TS_USERSPACE: "false"
      # Facultatif: partager ton réseau local (ex.: 192.168.1.0/24) avec le tailnet pour joindre aussi tes autres
      # appareils de la maison depuis l'extérieur. À activer ensuite dans la console (Machines -> Edit route settings).
      # TS_ROUTES: "192.168.1.0/24"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    volumes:
      - /volume1/docker/tailscale/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
